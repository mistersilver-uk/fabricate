<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Typeahead combobox suggestion lists — clipping and placement proof</title>
    <!--
      Served by `tests/components/typeahead-panel-rendered.test.js` from a Vite dev server, so
      `mount.js` imports the real `.svelte` components through the real Svelte plugin and
      `styles/fabricate.css` is served raw. What is measured is whether a suggestion list is
      hittable over the page and what opening it does to its scrolling ancestor, which is a
      cascade and a hit-test happy-dom does not compute.
    -->
    <link rel="stylesheet" href="/@typeahead-panel-styles/fabricate.css" />
    <style>
      /* Foundry core's universal border-box reset, which the product page always carries. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0b0a13;
      }

      /* Arial, so every text-derived box reproduces on a runner without Foundry's licensed face. */
      body {
        font-family: Arial, sans-serif;
      }

      /*
        Foundry core's own window rule, transcribed: ApplicationV2 positions the frame and writes
        its box inline. The frame's size is a query parameter so the resize clause can change the
        viewport and have the host follow it.
      */
      .application {
        position: absolute;
        inset: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #3b3a48;
        border-radius: 6px;
        background: #17161f;
      }

      .application > .window-content {
        flex: 1 1 auto;
        min-height: 0;
        padding: 0;
        overflow: hidden;
      }

      .application .fabricate-manager {
        width: 100%;
        height: 100%;
      }

      /*
        Where the scrolling ancestor stands in the application root. `is-top` leaves the root room
        beneath the ancestor, so the list has somewhere to float; `is-bottom` puts the ancestor on
        the root's bottom edge, where the only room is above the field.
      */
      .fixture-stage {
        position: absolute;
        left: 40px;
      }

      .fixture-stage.is-top {
        top: 40px;
      }

      .fixture-stage.is-bottom {
        bottom: 0;
      }

      /*
        Fixture chrome on the element that also carries the product's real clipping class: a short
        box, so the field at its bottom edge has less room beneath it than its list is tall. The
        overflow itself is the product rule's and is asserted rather than declared here.
      */
      .fixture-scroller {
        height: 150px;
      }

      .fixture-spacer {
        height: 220px;
      }

      /*
        A component that renders its own clipping ancestor is mounted whole, so the stage becomes
        the page it scrolls in. The task editor's browser card is 340px in the product, which
        leaves its tag list room; it is shortened here so the field sits on the card's bottom edge
        like every other family's, and the card's own `overflow` is still the product's. That
        makes this family a manufactured reproduction: no shipped card is this short.
      */
      .fixture-stage.is-owned {
        inset: 0;
        padding: 0 40px;
        overflow: auto;
      }

      .fixture-stage.is-owned .manager-task-component-browser-card {
        height: 64px;
        min-height: 0;
        max-height: 64px;
      }
    </style>
  </head>
  <body class="vtt game theme-dark">
    <script type="module" src="/tests/fixtures/typeahead-panel/mount.js"></script>
  </body>
</html>
