    <title>Fabricate Build Reference — live</title>
    <!-- Foundry serves the game view from the web root, so module-relative asset paths resolve against `/`. -->
    <base href="/" />

      specimen is an iframe carrying the cascade. `fabricate.css` is linked for its `--fab-*` tokens
      and self-hosted faces only: it has no bare-element selector. `library.js` appends the
      library's own stylesheet.
    -->
    <link rel="stylesheet" href="/@fabricate-styles/fabricate.css" />
    <link rel="stylesheet" href="/@view-lab/primitives/page.css" />
  </head>
