<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabricate Build Reference — live</title>
    <!--
      Foundry serves the game view from the web ROOT, so module code that references an asset the
      Foundry way - `icons/svg/item-bag.svg`, no leading slash - resolves against `/`. This page
      lives at /tests/view-lab/, so without this those paths would resolve against that directory
      and 404. Same reason and same value as index.html.
    -->
    <base href="/" />
    <!--
      THIS PAGE LOADS NO FOUNDRY STYLESHEET AT ALL (issue 1487), and that absence is the fix for a
      measured regression: `foundry2.css` loaded UNLAYERED here used to reach the library's own 948
      hand-drawn elements — `library.html` opened as a file never loads Foundry's stylesheet, so its
      drawings are unstyled by core, and this page's foundry2.css link painted them anyway. A
      `<DataTable>` entry with no live specimen rendered with a header band and row striping the
      reference never has, for exactly that reason.

      IT DOES STILL LOAD `styles/fabricate.css` (RAW, unlayered, no `foundry2.css` beside it), and
      that is a narrower thing than it sounds: the library's own kit CSS references only `--fab-*`
      custom properties, its own four page-local names, and nothing Foundry-core at all — measured
      by grepping every `var(--…)` the file contains. `library.js`'s `pageStyles()` drops the
      `--fab-*` copy of the palette from the library's own `:root` on purpose, so `fabricate.css`
      supplies those instead and any drift between the two becomes visible as a colour change
      rather than staying hidden in two files nobody diffs. `fabricate.css` has NO bare-element
      selector anywhere in it — every rule below its `:root` block and its `@font-face`s is scoped
      under `.fabricate`/`.fabricate-manager`, which nothing on this page carries — so linking it
      supplies exactly the tokens and the two self-hosted faces (Spectral, JetBrains Mono; Signika
      is a Google Fonts face the library's own `<link>` — never carried onto this page, see below —
      would otherwise have supplied) and paints not one bare element. THIS is the load-bearing
      difference from `foundry2.css`: one stylesheet has bare-element rules and one does not, and
      only the one that does not is safe to load page-wide.

      THE LIBRARY'S OWN STYLESHEET IS THE OTHER ONE LINKED HERE, and it is not even a `<link>`:
      `library.js` reads it out of `openspec/specs/design-system/library.html` at load time and
      appends it to <head> as a `<style>` — the same unlayered sheet the standalone file carries,
      painting the same 948 elements it always did, now correctly against the shipped palette
      instead of its own frozen copy of it.

      EVERY LIVE SPECIMEN IS ITS OWN `<iframe>` NOW, pointed at `specimen.html`, which carries the
      full production cascade — `foundry2.css`, Font Awesome, `styles/fabricate.css`, component CSS
      — internally, exactly as `index.html` loads it for a whole page. See `mount.js` and `slot.js`
      for the mechanics and for why an iframe is MORE faithful than the old shared-page slot, not
      less.

      `page.css` is this page's own remaining stylesheet: the sizing states `mount.js` moves each
      specimen's `<iframe>` element through, nothing more.

      NO GOOGLE FONTS LINK. The library's own `<head>` carries one (Spectral/Signika/JetBrains
      Mono), but `readLibrary()` only ever adopts the library's `<body>` and its `<style>` text —
      the `<link>` is never carried over, on this page or in the standalone file's own history.
      Signika is therefore visible only INSIDE a specimen's own iframe (`foundry2.css`'s harvested
      `@font-face`); this page's own drawn interface text falls back past it to the UA default,
      which is what the reference does too when Google Fonts is unreachable, and is why the oracle
      normalises `fontFamily` to its first family rather than asserting the fallback chain matched.
    -->
    <link rel="stylesheet" href="/@fabricate-styles/fabricate.css" />
    <link rel="stylesheet" href="/@view-lab/primitives/page.css" />
    <!--
      NO BACKDROP BLOCK, and no `body.game` scroll override either — both used to exist here to
      fight Foundry's OWN `foundry2.css:15257` `body.game { position: fixed; overflow: hidden }`,
      stamped by `configureLabPage()`. Neither applies to this page any more: `mount.js` no longer
      calls `configureLabPage()` on this document at all (it now runs once PER SPECIMEN, inside
      each iframe, where that fixed-viewport rule is exactly right for one production window). This
      page never carries Foundry's `vtt`/`game` body classes and never loads `foundry2.css`, so it
      scrolls the ordinary way a document scrolls, with nothing here needing to say so.
    -->
  </head>
  <body>
    <script type="module" src="/tests/view-lab/primitives/mount.js"></script>
  </body>
</html>
