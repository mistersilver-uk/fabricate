title: Fabricate
description: A system-agnostic crafting module for Foundry Virtual Tabletop
theme: just-the-docs

url: https://mistersilver-uk.github.io
baseurl: /fabricate

aux_links:
  "GitHub":
    - https://github.com/mistersilver-uk/fabricate

nav_sort: order

# The theme's footer is otherwise an <hr> with nothing under it on desktop -- the credit block
# below it is mobile-only. These two fill it.
back_to_top: true
back_to_top_text: Back to top

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/mistersilver-uk/fabricate
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Not `dark`. _includes/css/callouts.scss.liquid tests this name against the literal string
# "dark" and, when it matches, draws a callout's title and left bar in the same near-black
# hue as its hairline -- which is why .note and .gm titles were unreadable. Any other name
# keeps the two palette levels apart. See docs/_sass/color_schemes/fabricate.scss.
color_scheme: fabricate

# Each colour names a ramp defined in docs/_sass/custom/setup.scss, where -000 is the tone's
# hairline and -300 its title and left bar. Do not add `callouts_level`: `loud` collapses those
# two levels back together. Title glyphs are plain text-presentation characters, chosen over
# emoji so they take the callout's colour rather than rendering in their own.
callouts:
  warning:
    title: ▲ Warning
    color: fab-warning
  tip:
    title: ✦ Tip
    color: fab-tip
  note:
    title: ⓘ Note
    color: fab-note
  gm:
    title: ◆ GM Only
    color: fab-gm

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
