name: "PR Screenshots (View Lab)"

# Renders the Fabricate application windows a PR's changed files select, and publishes them into
# the PR's managed screenshot block — so UI evidence costs the author nothing.
#
# THIS JOB IS AN ACCELERATOR, NOT A GATE.
#
# It cannot be a gate, and the reason is structural rather than a preference. A fork PR receives no
# secrets and a read-only `GITHUB_TOKEN`, so it can neither harvest Foundry's chrome nor write the
# PR body. Failing such a PR for want of evidence it is not permitted to produce would make the
# check unsatisfiable by its author. `check-screenshots` in `ci.yml` remains the gate; this job
# just satisfies it automatically where it can. Where it cannot, the maintainer-pasted evidence
# path is unchanged.
#
# LICENSING — the constraint that shapes everything below.
#
# `.foundry-chrome/**` holds Foundry's proprietary client source, `foundry2.css`, and Font Awesome
# PRO webfonts. This repository is PUBLIC, and artifacts on a public repository are downloadable
# by anyone. So:
#
#   - no step uploads `.foundry-chrome/**`, or any parent of it, as an artifact;
#   - the publish step is scoped to `ui-screenshot-artifact/` by explicit path, never a walk of a
#     directory that could contain the cache;
#   - no new `actions/cache` entry holds harvested material.
#
# Only PNGs leave the runner. A raster drawn with a font is not the font.

on:
  pull_request:
    # NEVER `pull_request_target`. That trigger runs the BASE workflow with secrets available to a
    # checkout of untrusted head code — with Foundry credentials and AWS keys in scope here, it is
    # a straightforward arbitrary-code-execution vector on a public repository.
    # `edited` is deliberately absent. Publishing rewrites the PR body, which itself fires `edited`
    # — listening for it would make this job retrigger its own output indefinitely.
    #
    # This used to record a self-healing story that does not hold: that a first-push red in
    # `check-screenshots` cleared itself because the publish step's body edit fired the `edited`
    # event `ci.yml` DOES listen for. It cannot. The publish step edits the body with a `GH_TOKEN`
    # set from `github.token` — the default `GITHUB_TOKEN` — and GitHub does not create workflow
    # runs from events raised by that token, so the compensating `edited` run is never dispatched.
    # Confirmed against PR #1131's real history: its head has exactly ONE `ci.yml` run,
    # and that run is `run_attempt: 2`, a human clicking re-run. No `edited`-event run exists for
    # that head at all. That was the issue's "passes on a manual re-run, with no change to the
    # branch".
    #
    # The actual contract now (issue 1133): `check-screenshots` AWAITS this job's conclusion for the
    # same head SHA before it decides, and then re-reads the body this job wrote rather than a copy
    # fetched before it. It also matches what was published — each frame's head SHA and View Lab
    # case id come from its published S3 key — so waiting cannot be satisfied by a frame left over
    # from the previous head. Nothing in THIS job changed: it neither knows nor cares that it is
    # being waited on.
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to update the managed screenshot block

jobs:
  capture:
    # Same-repo PRs only. A fork PR has no secrets to harvest with and no write token to publish
    # with, so running it would produce a guaranteed red that its author cannot clear.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Raised from 25 (issue 1055). The full registry had crept to within seconds of the old
    # ceiling — the last run under it finished in 24m37s — so the next case to land tipped the
    # job into a CANCELLED conclusion at 25m12s, before its publish step. That reads as a
    # capture failure while actually being a capacity one, which is the expensive kind of red:
    # it points the reader at the frames rather than at the clock. A capture is also
    # self-limiting in a way a hung test is not (it renders a finite, declared case list), so a
    # generous ceiling costs nothing on the happy path and buys room for the registry to grow.
    timeout-minutes: 40
    # Declared at JOB level as well as workflow level (SonarCloud S8264): a job that writes to a PR
    # should state the write it needs where the write happens.
    permissions:
      contents: read
      pull-requests: write
      id-token: write # OIDC role assumption for the S3 upload
    env:
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
      FOUNDRY_ADMIN_KEY: fabricate-test-admin
      FOUNDRY_TELEMETRY: "false"

    steps:
      - uses: actions/checkout@v6

      - name: Check Foundry credentials
        run: |
          if [ -z "$FOUNDRY_USERNAME" ] || [ -z "$FOUNDRY_PASSWORD" ]; then
            echo "::warning::Foundry credentials unavailable; the View Lab cannot harvest chrome."
            echo "::warning::Falling back to the maintainer-pasted evidence path."
            echo "SKIP_CAPTURE=true" >> "$GITHUB_ENV"
          fi

      - name: Compute the selected cases
        if: env.SKIP_CAPTURE != 'true'
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        run: |
          # The files endpoint, not `gh pr diff --name-only`: the diff endpoint caps at 20,000
          # lines and 406s beyond it, which under `bash -e` kills the step before selection runs.
          #
          # Each entry's `patch` comes along for the ride, because the selector uses it: a change
          # confined to case-object literals in `viewLabCases.js` selects those cases instead of all
          # of them, which is the difference between a two-minute capture and a twenty-minute one.
          # The library never reads git itself — it is a pure function of what this step hands it —
          # and it widens back to the full corpus for any patch it cannot verify, so a `patch` the
          # API omits (it drops them for very large diffs) costs frames, never evidence.
          gh api "repos/$PR_REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | {filename: .filename, patch: (.patch // "")} | @json' > changed-files.jsonl
          SELECTION=$(node -e '
            const { readFileSync } = require("node:fs");
            import("./scripts/lib/viewLabCases.js").then(({ mapChangedFilesToCases, hasUiChanges }) => {
              const entries = readFileSync("changed-files.jsonl", "utf8")
                .split("\n")
                .filter(Boolean)
                .map((line) => JSON.parse(line));
              const files = entries.map((entry) => entry.filename);
              const patches = Object.fromEntries(entries.map((entry) => [entry.filename, entry.patch]));
              const ids = mapChangedFilesToCases(files, { patches }).map((c) => c.id);
              process.stdout.write(`${hasUiChanges(files)}\n${ids.join(",")}`);
            });
          ')
          HAS_UI=$(printf '%s' "$SELECTION" | head -n 1)
          IDS=$(printf '%s' "$SELECTION" | tail -n +2)
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "has_ui=$HAS_UI" >> "$GITHUB_OUTPUT"
          if [ -z "$IDS" ]; then
            echo "No changed file selects a View Lab case; nothing to render."
          else
            echo "Selected $(echo "$IDS" | tr ',' '\n' | wc -l) case(s)."
          fi
          # `check-screenshots` arms on exactly the same predicate (`isUiFile` over the changed
          # set). When it is unarmed there is no gate for these frames to satisfy, so rendering and
          # publishing them is pure cost — ~20 minutes on a lab-infrastructure PR that changes no
          # render file at all, this one included.
          #
          # The saving is deliberately taken on the RENDER and PUBLISH steps only, not by zeroing
          # `ids`. Everything before them still runs: the chrome harvest, the committed-provenance
          # check, and `view-lab-chrome-drift.test.js`, which verifies the frame builder still
          # transcribes this Foundry build. Skipping those on a lab-infrastructure change would
          # withdraw the verification exactly when the change most needs it.
          if [ "$HAS_UI" != "true" ]; then
            echo "No render file changed; check-screenshots is unarmed, so frames are verified but not rendered or published."
          fi

      - name: Setup Node.js
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != ''
        # `--ignore-scripts` (SonarCloud S6505): a dependency's install script would otherwise run
        # arbitrary code on a runner that holds an OIDC role and a PR write token. Playwright's
        # browser download is invoked explicitly below, so nothing here needs a lifecycle script.
        run: npm ci --ignore-scripts

      - name: Cache Playwright Chromium
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != ''
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != '' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npm run test:foundry:install

      # Caches the Foundry release ARCHIVE, which the harvest reads. This is the same cache entry
      # the smoke workflow already maintains, reused rather than duplicated — deliberately, because
      # a second entry holding licensed material is a second exposure.
      - name: Cache Foundry binary
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != ''
        uses: actions/cache@v5
        with:
          path: .foundry-e2e/cache
          key: foundry-binary-${{ runner.os }}-${{ hashFiles('docker-compose.foundry.yml') }}

      # BEFORE the archive step, not after the harvest. On a cold cache that step boots Foundry, and
      # `foundry-test-up.mjs` refuses to assemble a data directory without `dist/`. Building later
      # worked only for as long as the cache probe was a `foundryvtt-*.zip` glob that a stale entry
      # could satisfy; the moment the probe became exact, the first genuinely cold run failed here.
      - name: Build module
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != ''
        run: npm run build

      # The felddy image does NOT bundle Foundry; it authenticates and downloads on first boot. So
      # on a cold archive cache there is no way to obtain the chrome without a credentialed boot,
      # and the lab's "seconds, no Docker" property does not transfer to CI. This step pays that
      # cost only when the cache missed.
      #
      # The probe names the EXACT archive the pinned image will download, not `foundryvtt-*.zip`.
      # A glob is satisfied by whatever the cache happens to hold, so a restored entry carrying the
      # previous major reported "warm", skipped the boot, and harvested the wrong Foundry's chrome —
      # caught only by the provenance gate below, a whole CI cycle later.
      - name: Obtain the Foundry release archive
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != ''
        run: |
          VERSION=$(node --input-type=module -e "
            import { readPinnedFoundryImage, foundryVersionFromTag } from './scripts/lib/foundryImagePin.js';
            const { tag } = readPinnedFoundryImage('docker-compose.foundry.yml');
            const version = foundryVersionFromTag(tag);
            if (!version) throw new Error('the pinned image tag ' + tag + ' names no exact Foundry build');
            process.stdout.write(version);
          ")
          ARCHIVE=".foundry-e2e/cache/foundryvtt-${VERSION}.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "No cached $ARCHIVE — booting Foundry once to populate it."
            npm run test:foundry:up
            npm run test:foundry:down
          else
            echo "Archive cache is warm for $ARCHIVE; no boot required."
          fi

      - name: Harvest window chrome
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != ''
        run: npm run viewlab:chrome:harvest

      # The chrome and the frame builder are two halves of one artefact: `foundryChromeSpec.js` is
      # a hand transcription of `_renderFrame`/`_updateFrame`/`#applyPosition`, pinned by the
      # `applicationMjsSha256` in committed provenance. A newer stylesheet rendered through markup
      # transcribed from an older build gives genuine CSS around a stale DOM, and the PNG cannot
      # tell you which — strictly worse than no frame, because a wrong frame is believed.
      #
      # CI never rewrites the provenance. That file is a human attestation that someone re-read
      # `application.mjs` and confirmed the transcription still holds; a bot that refreshes it on
      # mismatch converts the drift gate into a rubber stamp.
      - name: Verify chrome matches committed provenance
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != ''
        run: |
          PINNED=$(node -p "require('./tests/view-lab/chrome-provenance.json').foundryVersion")
          HARVESTED=$(node -e "
            import('./scripts/lib/foundryChromeCache.js').then(({ resolveChromeCache }) => {
              const cache = resolveChromeCache(process.cwd());
              process.stdout.write(cache ? cache.version : '');
            });
          ")
          echo "pinned=$PINNED harvested=$HARVESTED"
          if [ "$PINNED" != "$HARVESTED" ]; then
            echo "::error::Harvested Foundry $HARVESTED does not match the pinned $PINNED."
            echo "::error::Re-read client/applications/api/application.mjs, confirm the frame builder still transcribes it, and commit the refreshed provenance."
            exit 1
          fi

      # Run the chrome-drift suite ON THE RUNNER THAT DRAWS. `VIEWLAB_REQUIRE_CHROME=1` turns the
      # drift test's "no cache, skip" into a failure — but only for a process that actually runs it,
      # which is why it is set here on the test command rather than on the job. Setting it as a job
      # env var alongside a job that never runs `npm test` reads as a safety control and is not one;
      # this file did exactly that until review caught it.
      - name: Verify the frame builder still transcribes this Foundry build
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != ''
        env:
          VIEWLAB_REQUIRE_CHROME: '1'
        run: node --test tests/view-lab-chrome-drift.test.js

      - name: Render the selected frames
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != '' && steps.select.outputs.has_ui == 'true'
        env:
          CASE_IDS: ${{ steps.select.outputs.ids }}
        run: node scripts/view-lab-screenshots.mjs apps "$CASE_IDS"

      # OIDC role assumption, matching every other AWS workflow in this repo
      # (`pr-screenshots-cleanup.yml`, `backfill-provenance.yml`, `promote-to-*.yml`). This job
      # originally passed `secrets.AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`, which are not set
      # in this repository — so the render succeeded, the upload failed with "Region is missing",
      # and the publish step exited 1 on every run. The accelerator rendered 150 frames and dropped
      # all of them.
      #
      # `continue-on-error`, matching `pr-screenshots-cleanup.yml`, because the role's TRUST POLICY
      # is repository infrastructure rather than something a PR can change. A trust policy that
      # scopes `sts:AssumeRoleWithWebIdentity` to named workflow refs will refuse this workflow
      # until it is added — observed here as "Not authorized to perform
      # sts:AssumeRoleWithWebIdentity" against an otherwise correctly resolved role and region.
      #
      # This job is an accelerator, not a gate, so an infrastructure gap outside the PR must not red
      # it. The publish step below warns loudly and the maintainer-pasted evidence path is unchanged.
      - name: Configure AWS credentials (OIDC)
        id: aws
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != '' && steps.select.outputs.has_ui == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_SCREENSHOTS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      # Scoped to the PNG output directory BY NAME. Never a parent, and never `.foundry-chrome`.
      - name: Publish into the PR's screenshot block
        if: env.SKIP_CAPTURE != 'true' && steps.select.outputs.ids != '' && steps.select.outputs.has_ui == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          S3_RELEASE_BUCKET: ${{ vars.S3_RELEASE_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          # Through `env:` rather than interpolated into the script body (SonarCloud S7630): a
          # `${{ }}` inside `run:` is substituted before the shell parses the line, so a value
          # carrying shell metacharacters is executed rather than passed.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ steps.aws.outcome }}" != "success" ]; then
            echo "::warning::Could not assume the screenshot upload role, so no frames were published."
            echo "::warning::The frames rendered fine — this is an IAM trust-policy gap, not a PR problem."
            echo "::warning::Add this workflow's ref to the trust policy of ${{ vars.AWS_SCREENSHOTS_ROLE_TO_ASSUME }}."
            echo "::warning::Until then, paste evidence manually or apply the screenshots-exempt label."
            exit 0
          fi
          node scripts/ui-pr-screenshot-evidence.mjs publish \
            --pr "$PR_NUMBER" \
            --repo "$PR_REPO" \
            --output-dir ui-screenshot-artifact/apps \
            --head-sha "$HEAD_SHA"
