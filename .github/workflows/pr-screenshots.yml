name: "PR Screenshots (View Lab)"

# Renders the Fabricate application windows a PR's changed files select, and publishes them into
# the PR's managed screenshot block — so UI evidence costs the author nothing.
#
# THIS JOB IS AN ACCELERATOR, NOT A GATE.
#
# It cannot be a gate, and the reason is structural rather than a preference. A fork PR receives no
# secrets and a read-only `GITHUB_TOKEN`, so it can neither harvest Foundry's chrome nor write the
# PR body. Failing such a PR for want of evidence it is not permitted to produce would make the
# check unsatisfiable by its author. `check-screenshots` in `ci.yml` remains the gate; this job
# just satisfies it automatically where it can. Where it cannot, the maintainer-pasted evidence
# path is unchanged.
#
# LICENSING — the constraint that shapes everything below.
#
# `.foundry-chrome/**` holds Foundry's proprietary client source, `foundry2.css`, and Font Awesome
# PRO webfonts. This repository is PUBLIC, and artifacts on a public repository are downloadable
# by anyone. So:
#
#   - no step uploads `.foundry-chrome/**`, or any parent of it, as an artifact;
#   - the publish step is scoped to `ui-screenshot-artifact/` by explicit path, never a walk of a
#     directory that could contain the cache;
#   - no new `actions/cache` entry holds harvested material.
#
# Only PNGs leave the runner. A raster drawn with a font is not the font.

on:
  pull_request:
    # NEVER `pull_request_target`. That trigger runs the BASE workflow with secrets available to a
    # checkout of untrusted head code — with Foundry credentials and AWS keys in scope here, it is
    # a straightforward arbitrary-code-execution vector on a public repository.
    # `edited` is deliberately absent. Publishing rewrites the PR body, which itself fires `edited`
    # — listening for it would make this job retrigger its own output indefinitely.
    #
    # This used to record a self-healing story that does not hold: that a first-push red in
    # `check-screenshots` cleared itself because the publish step's body edit fired the `edited`
    # event `ci.yml` DOES listen for. It cannot. The publish step edits the body with a `GH_TOKEN`
    # set from `github.token` — the default `GITHUB_TOKEN` — and GitHub does not create workflow
    # runs from events raised by that token, so the compensating `edited` run is never dispatched.
    # Confirmed against PR #1131's real history: its head has exactly ONE `ci.yml` run,
    # and that run is `run_attempt: 2`, a human clicking re-run. No `edited`-event run exists for
    # that head at all. That was the issue's "passes on a manual re-run, with no change to the
    # branch".
    #
    # The actual contract now (issue 1133): `check-screenshots` AWAITS this job's conclusion for the
    # same head SHA before it decides, and then re-reads the body this job wrote rather than a copy
    # fetched before it. It also matches what was published — each frame's head SHA and View Lab
    # case id come from its published S3 key — so waiting cannot be satisfied by a frame left over
    # from the previous head. Nothing in THIS job changed: it neither knows nor cares that it is
    # being waited on.
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only here; each write is granted on the one job that needs it (SonarCloud: capture alone
# holds the PR write and the OIDC token, and no render shard holds any write at all).
permissions:
  contents: read

jobs:
  # ONE selection, computed once, then split across parallel runners (issue 2119). A 357-frame
  # selection took 40 minutes and more on one runner; the maintainer's ruling is that no change may
  # wait that long. `render` is the matrix of shards and `capture` merges and publishes once.
  #
  # THE TIMEOUTS ARE ONE BUDGET. `check-screenshots` waits on this workflow's whole run, and its
  # `--capture-timeout-minutes` in `ci.yml` must equal select + warm-foundry + the longer of
  # render and verify-chrome (which run side by side) + capture;
  # `tests/ci-workflow-semantics.test.js` asserts that sum. The full registry, split twelve ways,
  # is about fifty-five frames a runner.
  select:
    # Same-repo PRs only. A fork PR has no secrets to harvest with and no write token to publish
    # with, so running it would produce a guaranteed red that its author cannot clear.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Whether the credentials exist, not the credentials: nothing in this job boots Foundry.
    env:
      HAS_FOUNDRY_CREDENTIALS: ${{ secrets.FOUNDRY_USERNAME != '' && secrets.FOUNDRY_PASSWORD != '' }}
    outputs:
      ids: ${{ steps.select.outputs.ids }}
      has_ui: ${{ steps.select.outputs.has_ui }}
      matrix: ${{ steps.select.outputs.matrix }}
      foundry_cache_hit: ${{ steps.foundry-cache.outputs.cache-hit }}

    steps:
      - uses: actions/checkout@v6

      - name: Check Foundry credentials
        run: |
          if [ "$HAS_FOUNDRY_CREDENTIALS" != "true" ]; then
            echo "::warning::Foundry credentials unavailable; the View Lab cannot harvest chrome."
            echo "::warning::Falling back to the maintainer-pasted evidence path."
            echo "SKIP_CAPTURE=true" >> "$GITHUB_ENV"
          fi

      - name: Compute the selected cases
        if: env.SKIP_CAPTURE != 'true'
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        run: |
          # The files endpoint, not `gh pr diff --name-only`: the diff endpoint caps at 20,000
          # lines and 406s beyond it, which under `bash -e` kills the step before selection runs.
          #
          # Each entry's `patch` comes along for the ride, because the selector uses it: a change
          # confined to case-object literals in `scripts/lib/view-lab-cases/` selects those
          # cases instead of surface coverage, which is the difference between a two-minute
          # capture and a four-minute one. The library never reads git itself — it is a pure function of what
          # this step hands it — and it widens back to surface coverage (one frame of every route
          # and tab the lab renders) for any patch it cannot verify, so a `patch` the API omits (it drops
          # them for very large diffs) costs frames, never evidence.
          gh api "repos/$PR_REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | {filename: .filename, patch: (.patch // "")} | @json' > changed-files.jsonl
          SELECTION=$(node -e '
            const { readFileSync } = require("node:fs");
            import("./scripts/lib/viewLabCases.js").then(({ mapChangedFilesToCases, hasUiChanges }) => {
              const entries = readFileSync("changed-files.jsonl", "utf8")
                .split("\n")
                .filter(Boolean)
                .map((line) => JSON.parse(line));
              const files = entries.map((entry) => entry.filename);
              const patches = Object.fromEntries(entries.map((entry) => [entry.filename, entry.patch]));
              const ids = mapChangedFilesToCases(files, { patches }).map((c) => c.id);
              process.stdout.write(`${hasUiChanges(files)}\n${ids.join(",")}`);
            });
          ')
          HAS_UI=$(printf '%s' "$SELECTION" | head -n 1)
          IDS=$(printf '%s' "$SELECTION" | tail -n +2)
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "has_ui=$HAS_UI" >> "$GITHUB_OUTPUT"
          if [ -z "$IDS" ]; then
            echo "No changed file selects a View Lab case; nothing to render."
          else
            echo "Selected $(echo "$IDS" | tr ',' '\n' | wc -l) case(s)."
          fi
          # `check-screenshots` arms on exactly the same predicate (`isUiFile` over the changed
          # set). When it is unarmed there is no gate for these frames to satisfy, so rendering and
          # publishing them is pure cost — a surface-coverage capture on a lab-infrastructure PR
          # that changes no render file at all, this one included.
          #
          # The saving is deliberately taken on the RENDER and PUBLISH steps only, not by zeroing
          # `ids`. Everything before them still runs: the chrome harvest, the committed-provenance
          # check, and `view-lab-chrome-drift.test.js`, which verifies the frame builder still
          # transcribes this Foundry build. Skipping those on a lab-infrastructure change would
          # withdraw the verification exactly when the change most needs it.
          if [ "$HAS_UI" != "true" ]; then
            echo "No render file changed; check-screenshots is unarmed, so frames are verified but not rendered or published."
          fi
          # The shards: balanced, each in selection order, every distinct-evidence group on one
          # runner so the renderer's byte-identity check still sees the whole group. None when
          # the gate is unarmed; verify-chrome still verifies the harvest.
          MATRIX=$(node scripts/view-lab-shards.mjs plan "$IDS" "$HAS_UI")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      # Probe, do not restore: `warm-foundry` fills a cold cache once, so the shards and
      # verify-chrome never each boot Foundry and download it with the same account at once.
      - name: Probe the Foundry archive cache
        if: env.SKIP_CAPTURE != 'true'
        id: foundry-cache
        uses: actions/cache/restore@v5
        with:
          path: .foundry-e2e/cache
          key: foundry-binary-${{ runner.os }}-${{ hashFiles('docker-compose.foundry.yml') }}
          lookup-only: true

  # Boots Foundry once to fill a cold archive cache, and saves it for every later job. On a warm
  # cache every step skips; the job still runs, so the jobs after it keep a plain success() chain
  # rather than needing always() to survive a skipped dependency.
  warm-foundry:
    needs: select
    if: needs.select.outputs.ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
      FOUNDRY_ADMIN_KEY: fabricate-test-admin
      FOUNDRY_TELEMETRY: "false"

    steps:
      - uses: actions/checkout@v6
        if: needs.select.outputs.foundry_cache_hit != 'true'

      - name: Fill the Foundry archive cache
        if: needs.select.outputs.foundry_cache_hit != 'true'
        uses: ./.github/actions/prepare-view-lab
        with:
          archive-only: 'true'

  render:
    needs: [select, warm-foundry]
    if: needs.select.outputs.ids != '' && needs.select.outputs.has_ui == 'true'
    name: Render shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # Every shard reports its own failures rather than being cancelled by the first.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
      FOUNDRY_ADMIN_KEY: fabricate-test-admin
      FOUNDRY_TELEMETRY: "false"

    steps:
      - uses: actions/checkout@v6

      - name: Prepare the View Lab
        uses: ./.github/actions/prepare-view-lab

      - name: Render the selected frames
        env:
          CASE_IDS: ${{ matrix.ids }}
        run: node scripts/view-lab-screenshots.mjs apps "$CASE_IDS"

      # The PNGs and the manifest BY NAME, never the directory or a parent of it: see LICENSING
      # above. A day is enough for `capture` to read them.
      - name: Upload this shard's frames
        uses: actions/upload-artifact@v6
        with:
          name: view-lab-shard-${{ matrix.shard }}
          path: |
            ui-screenshot-artifact/apps/*.png
            ui-screenshot-artifact/apps/manifest.json
          if-no-files-found: error
          retention-days: 1

  # The chrome-dependent suites verify the one harvest every shard draws from, so they run ONCE,
  # beside the shards rather than ahead of any of them; `capture` needs this job, so a failed
  # verification still withholds the publish.
  verify-chrome:
    needs: [select, warm-foundry]
    if: needs.select.outputs.ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
      FOUNDRY_ADMIN_KEY: fabricate-test-admin
      FOUNDRY_TELEMETRY: "false"

    steps:
      - uses: actions/checkout@v6

      - name: Prepare the View Lab
        uses: ./.github/actions/prepare-view-lab

      # Run the chrome-dependent suites against the same harvest the shards draw with.
      # `VIEWLAB_REQUIRE_CHROME=1` turns "no cache, skip" into a failure — but only for a process
      # that actually runs them, which is why it is set here on the test command rather than on the job. Setting it as a job env var
      # alongside a job that never runs `npm test` reads as a safety control and is not one; this
      # file did exactly that until review caught it.
      #
      # ALL THREE suites belong here, and each was a skipped or vacuous test everywhere until it
      # was added. `tests/view-lab-fixture-assets.test.js` walks every asset path the lab world
      # names and asserts it resolves in the harvested chrome; the defect it exists for — a 404
      # fixture path that aborts a capture run and publishes ZERO frames — is precisely a CI
      # failure mode. `ci.yml`'s `npm test` runner holds no cache, so the suite skipped there, and
      # this job was the only one that harvests a cache and it ran the drift suite alone. The guard
      # existed and executed nowhere (issue 1371, quality review r9 F2).
      #
      # `tests/components/components-browser-rendered.test.js` joined for the same reason (issue
      # 1371, quality review round 5 Q2). Its M28 claim — that a component row's medallion stays at
      # the row's leading edge under a chrome that centres a button's content — is measured under a
      # HAND-WRITTEN one-line stand-in for Foundry's sheet and, separately, under the harvested
      # sheet itself. Only the second arm measures Foundry; with no cache it skipped, so in CI the
      # ruling was carried entirely by the transcription. The suite now also reads a bare `<button>`
      # under each chrome and asserts the two agree, which is the drift check the mirror never had —
      # and that check is likewise real only where a harvest exists.
      #
      # AND THE TWO ENTRY-FRAME SUITES JOINED IN r20 (issue 1371, Foundry review round 6 finding 3,
      # quality review round 6 R2). Revision 19 gave both of them arms that re-measure the frame's
      # whole contract under the harvested sheet, wrote a shared skip policy saying those arms run
      # on THIS step — and named neither file here. With the harvest moved aside both reported
      # `tests 40, pass 20, skipped 20` and stayed green even under VIEWLAB_REQUIRE_CHROME=1, so
      # the arms executed on a maintainer's machine and nowhere else. All three now register
      # `registerChromeRunnerGuards` from `tests/helpers/harvestedFoundryChrome.js`, which both
      # fails loudly on a missing harvest and asserts, against this file, that the calling suite is
      # named on the step below.
      #
      # `--conditions=browser` because all three rendered suites MOUNT Svelte components (`npm test`
      # sets the same condition); without it every mount fails with "mount(...) is not available on
      # the server". `--test-timeout` matches `npm test` rather than leaving the default of none, so
      # a hung Chromium fails the step instead of running out the job's clock.
      #
      # THE STEP'S NAME IS LOAD-BEARING, and it is now spelled in exactly two places: here, and
      # `CHROME_STEP_NAME` in `tests/helpers/harvestedFoundryChrome.js`, which every chrome-dependent
      # component suite asserts this step against. `tests/view-lab-fixture-assets.test.js` quotes it
      # in prose as well, because it is a root suite that does not mount and so does not import that
      # helper. Rename it here and those two change with it — the r19 name ("Verify the harvested
      # chrome still matches, and every lab asset path resolves in it") was left in place precisely
      # because it was transcribed in more places than that, which is the mirror rot this collapse
      # ends. No colon inside the name: a plain YAML scalar cannot carry one.
      - name: Run every chrome-dependent suite, where a missing harvest fails instead of skipping
        env:
          VIEWLAB_REQUIRE_CHROME: '1'
        run: |
          node --conditions=browser --test --test-timeout=300000 \
            tests/view-lab-chrome-drift.test.js \
            tests/view-lab-fixture-assets.test.js \
            tests/components/components-browser-rendered.test.js \
            tests/components/component-edit-frame-rendered.test.js \
            tests/components/world-component-entry-frame-rendered.test.js

  # Runs only when every shard and the chrome verification succeeded: a failure there fails the
  # run unpublished, as a failed render always has.
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: [select, render, verify-chrome]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Declared at JOB level as well as workflow level (SonarCloud S8264): a job that writes to a PR
    # should state the write it needs where the write happens.
    permissions:
      contents: read
      pull-requests: write
      id-token: write # OIDC role assumption for the S3 upload

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `--ignore-scripts` (SonarCloud S6505): a dependency's install script would otherwise run
        # arbitrary code on a runner that holds an OIDC role and a PR write token, as this one does.
        run: npm ci --ignore-scripts

      - name: Download every shard's frames
        uses: actions/download-artifact@v7
        with:
          pattern: view-lab-shard-*
          path: ui-screenshot-artifact/shards

      # One manifest, identical to what a single unsharded render writes, and a refusal when the
      # shards lost, repeated or invented a case.
      - name: Merge the shards into one frame set
        env:
          CASE_IDS: ${{ needs.select.outputs.ids }}
        run: node scripts/view-lab-shards.mjs merge "$CASE_IDS" ui-screenshot-artifact/shards ui-screenshot-artifact/apps

      # OIDC role assumption, matching every other AWS workflow in this repo
      # (`pr-screenshots-cleanup.yml`, `backfill-provenance.yml`, `promote-to-*.yml`). This job
      # originally passed `secrets.AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`, which are not set
      # in this repository — so the render succeeded, the upload failed with "Region is missing",
      # and the publish step exited 1 on every run. The accelerator rendered 150 frames and dropped
      # all of them.
      #
      # `continue-on-error`, matching `pr-screenshots-cleanup.yml`, because the role's TRUST POLICY
      # is repository infrastructure rather than something a PR can change. A trust policy that
      # scopes `sts:AssumeRoleWithWebIdentity` to named workflow refs will refuse this workflow
      # until it is added — observed here as "Not authorized to perform
      # sts:AssumeRoleWithWebIdentity" against an otherwise correctly resolved role and region.
      #
      # This job is an accelerator, not a gate, so an infrastructure gap outside the PR must not red
      # it. The publish step below warns loudly and the maintainer-pasted evidence path is unchanged.
      - name: Configure AWS credentials (OIDC)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_SCREENSHOTS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      # Scoped to the PNG output directory BY NAME. Never a parent, and never `.foundry-chrome`.
      - name: Publish into the PR's screenshot block
        env:
          GH_TOKEN: ${{ github.token }}
          S3_RELEASE_BUCKET: ${{ vars.S3_RELEASE_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          # Through `env:` rather than interpolated into the script body (SonarCloud S7630): a
          # `${{ }}` inside `run:` is substituted before the shell parses the line, so a value
          # carrying shell metacharacters is executed rather than passed.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ steps.aws.outcome }}" != "success" ]; then
            echo "::warning::Could not assume the screenshot upload role, so no frames were published."
            echo "::warning::The frames rendered fine — this is an IAM trust-policy gap, not a PR problem."
            echo "::warning::Add this workflow's ref to the trust policy of ${{ vars.AWS_SCREENSHOTS_ROLE_TO_ASSUME }}."
            echo "::warning::Until then, paste evidence manually or apply the screenshots-exempt label."
            exit 0
          fi
          node scripts/ui-pr-screenshot-evidence.mjs publish \
            --pr "$PR_NUMBER" \
            --repo "$PR_REPO" \
            --output-dir ui-screenshot-artifact/apps \
            --head-sha "$HEAD_SHA"
