name: CI

on:
  pull_request:
    # `edited` re-runs only title/screenshot metadata checks. `ready_for_review`
    # starts a fresh full gate run after the draft-head preflight.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main
      - release
      - '[0-9]+.[0-9]+.x'

concurrency:
  # Metadata edits must not cancel an in-flight code-gate run for the same PR.
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  unit-tests:
    # Skip on `edited` PR events: editing the title/body doesn't change the head
    # commit, so the existing result for that SHA still stands. Runs on push and
    # all other PR events, including `ready_for_review`.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Build module
        run: npm run build

  lint:
    # Skip on `edited` PR events for the same reason as unit-tests: editing the
    # title/body doesn't change the head commit, so the existing result stands.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint Svelte components (ESLint)
        run: npm run lint:svelte

      # The graph-independent Svelte compiler-warning sweep (issue 924). `npm run build`
      # also fails on a warning via `onwarn` in `svelte.config.js`, but a Vite build
      # compiles only the entry graph and is blind to a component nothing imports, so the
      # authoritative gate is this sweep over every `src/**/*.svelte`.
      - name: Check Svelte compiler warnings
        run: npm run lint:svelte:warnings

      - name: Lint styles (Stylelint)
        run: npm run lint:css

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint markdown (markdownlint)
        run: npm run lint:md

  validate-bindings:
    # Pure-Node consistency check for the agent role bindings (skills <-> Codex
    # <-> Claude <-> AGENTS.md table). No install needed — the script has no deps.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate agent bindings
        run: npm run validate:agents

  lint-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint commit messages
        run: |
          # Lint all commits on this PR (from base to HEAD). Invoked through the local bin rather
          # than `npx` per Sonar S6505/S8543: `npx` falls back to fetching and RUNNING an unpinned
          # package from the registry when the name does not resolve locally, so a lockfile-verified
          # @commitlint/cli is the supply-chain-safe form. This is the same idiom the playwright
          # steps already use.
          ./node_modules/.bin/commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

      - name: Lint PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Read the live title (not the event payload) so a re-run or `edited`
          # event always lints the current PR title.
          PR_TITLE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json title --jq .title)
          echo "$PR_TITLE" | ./node_modules/.bin/commitlint --verbose

  check-screenshots:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 75, raised from 5 (issue 1133). This job now AWAITS the `capture` job in
    # `pr-screenshots.yml` for the same head SHA before deciding, and that job's own ceiling is 40
    # minutes. The script's `maxWaitMs` (65 minutes) fires first by construction — the bounds
    # inequality in `tests/ci-workflow-semantics.test.js` pins that ordering against this number —
    # so a wait that runs long reports `capture-did-not-conclude` with a diagnosis rather than
    # being killed here with none.
    timeout-minutes: 75
    # Declared at JOB level as well as workflow level (SonarCloud S8264). Job-level permissions
    # REPLACE the workflow-level block rather than merging with it, so all three are restated;
    # `actions: read` is the new one, needed to list the producer's workflow runs.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check for screenshots in UI/UX PRs
        # Every value reaches the shell through `env:` and is referenced as `$VAR` (SonarCloud
        # S7630): a `${{ }}` inside `run:` is substituted before the shell parses the line, so a
        # value carrying shell metacharacters would be executed rather than passed.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # The SAME expression `capture`'s `if:` uses in pr-screenshots.yml, so the two cannot
          # drift into disagreeing about whether a producer run can exist for this head. A fork PR
          # has no producer to wait for, so the gate decides immediately on the body — which is
          # also the only path a fork's author can satisfy.
          # `tests/ci-workflow-semantics.test.js` compares the two SEMANTICALLY, over a
          # same-repo/fork truth table, rather than by string equality.
          CAPTURE_ELIGIBLE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # Read the live body (not the event payload) so a re-run or `edited`
          # event sees screenshots added after the PR was opened. The script
          # RE-READS the body itself after the capture run concludes; this copy
          # only feeds the fast path, which passes without waiting when the body
          # already satisfies the gate for this head.
          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "$PR_REPO" --json body --jq .body)
          printf '%s\n' "$PR_BODY" > pr-body.md

          # Get changed files. Use the files endpoint, NOT `gh pr diff
          # --name-only`: that fetches the unified diff, which the API caps at
          # 20,000 lines and rejects with `HTTP 406 ... diff too_large` beyond
          # it. This step runs under `bash -e`, so on a large PR the job died
          # here — before the evidence script ran — and the maintainer-applied
          # `screenshots-exempt` label was never even read, making the gate
          # unskippable. The files endpoint returns metadata rather than a diff
          # body, so no line cap applies; `--paginate` walks its 100-per-page
          # pages. It does cap out at 3000 files (a limit no PR should reach).
          #
          # Each entry's `patch` comes along for the ride, exactly as
          # pr-screenshots.yml already requests it, because the frame matcher
          # selects expected cases with the SAME `mapChangedFilesToCases` the
          # producer selects with — and that function narrows its selection from
          # the patch. ONE paginated call, split locally into the filename list
          # and the patch map: two calls would double the API cost and take two
          # snapshots that can disagree if a push lands between them.
          gh api "repos/$PR_REPO/pulls/$PR_NUMBER/files" \
            --paginate \
            --jq '.[] | {filename: .filename, patch: (.patch // "")} | @json' > changed-files.jsonl
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const entries = readFileSync("changed-files.jsonl", "utf8")
              .split("\n")
              .filter(Boolean)
              .map((line) => JSON.parse(line));
            writeFileSync("changed-files.txt", entries.map((entry) => entry.filename).join("\n"));
          '

          # Read the live label list. Only a maintainer-applied
          # `screenshots-exempt` label can skip this check; agents cannot
          # self-apply labels, so this cannot be no-op'd from the PR body.
          PR_LABELS=$(gh pr view "$PR_NUMBER" --repo "$PR_REPO" --json labels --jq '.labels[].name')
          printf '%s\n' "$PR_LABELS" > labels.txt

          node scripts/ui-pr-screenshot-evidence.mjs check \
            --changed-files changed-files.txt \
            --patches-file changed-files.jsonl \
            --body-file pr-body.md \
            --labels labels.txt \
            --exempt-label screenshots-exempt \
            --pr "$PR_NUMBER" \
            --repo "$PR_REPO" \
            --head-sha "$HEAD_SHA" \
            --head-branch "$PR_HEAD_BRANCH" \
            --head-repository "$PR_HEAD_REPO" \
            --await-capture \
            --capture-eligible "$CAPTURE_ELIGIBLE" \
            --capture-workflow pr-screenshots.yml \
            --capture-timeout-minutes 40
