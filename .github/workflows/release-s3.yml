name: "Publish to S3"

# Reusable per-channel publisher. Takes a release TAG, derives its version, builds that tagged
# commit in its own worktree, and publishes to the requested channel's S3 targets. Called by beta.yml
# (channel: beta) and release.yml (early-access, or a hotfix line's own channel).
#
# The tag supplies the built bytes; the publisher tooling (scripts/release-s3.js and the
# release.s3.config.json it reads) runs from the workflow ref (issue #1988). A publisher recorded in
# an older tag cannot read a configuration shape introduced after it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.4.0-beta.3 or v1.4.0)"
        required: true
        type: string
      channel:
        description: "Channel to publish (beta, early-access, public, or a hotfix line)"
        required: false
        type: string
        default: beta
      check_heads:
        description: "Read and report every target's head + the guard verdict; publish nothing"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry-run: build and stage but do not upload"
        required: false
        type: boolean
        default: false
      overwrite:
        description: "Allow overwriting an existing versioned zip"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.4.0-beta.3 or v1.4.0)"
        required: true
        type: string
      channel:
        description: "Channel to publish (beta, early-access, public, or a hotfix line)"
        required: false
        type: string
        default: beta
      check_heads:
        description: "Read and report every target's head + the guard verdict; publish nothing"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry-run: build and stage but do not upload"
        required: false
        type: boolean
        default: false
      overwrite:
        description: "Allow overwriting an existing versioned zip"
        required: false
        type: boolean
        default: false
    secrets:
      # Secrets are NOT inherited by reusable workflows — the caller (beta.yml, and later the
      # early-access/public promotions) must pass these through explicitly. The publish refuses to
      # run if any tester group a channel declares has its tester-path secret unset.
      S3_TESTER_PATH_SECRET:
        description: "Secret directory segment for the closed-beta tester feed path"
        required: false
      S3_APPRENTICE_PATH_SECRET:
        description: "Secret directory segment for the apprentice-crafter early-access tester feed path"
        required: false
      S3_GUILD_ARTISAN_PATH_SECRET:
        description: "Secret directory segment for the guild-artisan early-access tester feed path"
        required: false

# id-token: write lets the workflow request a GitHub OIDC token, which is
# exchanged with AWS STS for short-lived role credentials. AWS access is
# controlled entirely by the IAM role's trust + permissions policies.
permissions:
  id-token: write
  contents: read

jobs:
  release-s3:
    runs-on: ubuntu-latest
    # Two dependency installs (the publisher's and the tag's) plus the tag's build.
    timeout-minutes: 20
    # Job-level (NOT workflow-level) so it survives being called as a reusable workflow, and
    # per-channel so a beta publish and a public publish do not serialise needlessly. cancel-in-
    # progress is false: a second push must QUEUE behind an in-flight publish, never cancel it
    # mid-loop and leave a half-written (channel-manifest-but-not-tester) state behind.
    concurrency:
      group: release-s3-${{ inputs.channel }}
      cancel-in-progress: false
    steps:
      # Tag validation runs AFTER checkout (it needs scripts/), not before it. The
      # validator is deliberately zero-dependency, so it runs on the runner's
      # preinstalled Node — before setup-node and npm ci.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          # Derive the required tag kind FROM the channel, never `--kind any`. The head guard in
          # release-s3.js only refuses BACKWARD moves, so a stable tag on `channel: beta` would pass
          # both validation and the guard (stable compares newer than beta = "forward") and pollute
          # the beta head with a stable version. beta accepts a beta/rc prerelease tag (what
          # BETA_TAG_RE matches); every other channel (early-access, public, a hotfix N.N.x) takes a
          # stable tag.
          KIND=$([ "$CHANNEL" = "beta" ] && echo beta || echo stable)
          VERSION=$(node scripts/validate-release-tag.mjs "$RELEASE_TAG" --kind "$KIND")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $RELEASE_TAG → version $VERSION (channel $CHANNEL, kind $KIND)"

      - name: Validate tag exists
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! git tag -l "$RELEASE_TAG" | grep -q .; then
            echo "::error::Tag '$RELEASE_TAG' does not exist"
            exit 1
          fi

      # Shared Node + npm ci + OIDC preamble, installing the WORKFLOW REF's dependencies: the
      # publisher runs from this checkout, and the tag is built in a worktree beside it (next step).
      # OIDC credentials are needed for a real publish AND for a `--check-heads` read; they are
      # skipped only on a dry-run that is NOT also reading heads (the script imports no AWS SDK and
      # reaches no bucket when `--dry-run` is set alone). aws-role/aws-region are forwarded because
      # the composite cannot read vars.* itself.
      - uses: ./.github/actions/release-setup
        with:
          enable-oidc: ${{ !inputs.dry_run || inputs.check_heads }}
          aws-role: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check the release tag out beside the publisher
        id: source
        uses: ./.github/actions/release-source
        with:
          tag: ${{ inputs.tag }}

      - name: Publish to S3
        env:
          S3_RELEASE_BUCKET: ${{ vars.S3_RELEASE_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          # Secret directory segments for the private tester feed paths. GitHub masks their values
          # in logs; the script also withholds all S3 keys/URLs in CI and refuses to publish a
          # channel when any tester group it declares has its own tester-path secret unset.
          S3_TESTER_PATH_SECRET: ${{ secrets.S3_TESTER_PATH_SECRET }}
          S3_APPRENTICE_PATH_SECRET: ${{ secrets.S3_APPRENTICE_PATH_SECRET }}
          S3_GUILD_ARTISAN_PATH_SECRET: ${{ secrets.S3_GUILD_ARTISAN_PATH_SECRET }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
          # The tag's worktree and the commit it holds. --source-sha must NOT come from GITHUB_SHA,
          # which names the workflow ref, not the commit whose bytes this zip carries; the provenance
          # guard keys resume/overwrite on it, and release-s3.js refuses a sha that tree does not hold.
          SOURCE_ROOT: ${{ steps.source.outputs.path }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node scripts/release-s3.js \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --source-root "$SOURCE_ROOT" \
            --source-sha "$SOURCE_SHA" \
            ${{ inputs.check_heads == true && '--check-heads' || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            ${{ inputs.overwrite == true && '--overwrite' || '' }}
