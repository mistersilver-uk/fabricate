name: Station hotfix 2265 validation
on:
  push:
    branches:
      - work/2265-station-hotfix-validation
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Export pinned source and test dependencies
        shell: bash
        run: |
          mkdir -p transfer
          git branch transfer-hotfix 2b35db158ebca753186b80ce4ac47842250896da
          git branch transfer-release 4f92d687dda38e0b64f57d42ce7e51bcc66b006f
          git bundle create transfer/fabricate.bundle transfer-hotfix transfer-release
          git worktree add --detach ../deps 2b35db158ebca753186b80ce4ac47842250896da
          cd ../deps
          npm ci --ignore-scripts --no-audit --no-fund > ../fabricate/transfer/install.log 2>&1
          tar -czf ../fabricate/transfer/dependencies.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: station-hotfix-source
          path: transfer/
          retention-days: 1
          compression-level: 0
