name: Station hotfix 2265 validation
on:
  push:
    branches:
      - work/2265-station-hotfix-validation
    paths:
      - '.github/workflows/station-hotfix-2265.yml'
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read failed job log and print assertion contexts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --allow-escape-sequences repos/mistersilver-uk/fabricate/actions/jobs/113224154726/logs > unit-tests.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', Path('unit-tests.log').read_text())
          lines = text.splitlines()
          selected = set()
          for i, line in enumerate(lines):
              if 'not ok ' in line:
                  selected.update(range(max(0, i-2), min(len(lines), i+55)))
          selected.update(range(max(0, len(lines)-25), len(lines)))
          output = '\n'.join(lines[i] for i in sorted(selected))
          Path('failures.txt').write_text(output)
          print(output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr2267-failure-log
          path: |
            failures.txt
            unit-tests.log
          retention-days: 1
