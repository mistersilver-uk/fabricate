name: Station hotfix 2265 validation
on:
  push:
    branches:
      - work/2265-station-hotfix-validation
    paths:
      - '.github/workflows/station-hotfix-2265.yml'
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read failed job log and print assertion contexts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/mistersilver-uk/fabricate/actions/jobs/113224154726/logs > unit-tests.log
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('unit-tests.log').read_text().splitlines()
          output = []
          for i, line in enumerate(lines):
              if 'not ok ' in line or 'ERR_TEST_FAILURE' in line:
                  output.extend(lines[max(0, i-2):min(len(lines), i+45)])
          output.extend(lines[-25:])
          text = '\n'.join(output)
          Path('failures.txt').write_text(text)
          print(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr2267-failure-log
          path: |
            failures.txt
            unit-tests.log
          retention-days: 1
