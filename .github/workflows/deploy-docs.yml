name: "Deploy Docs"

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'

jobs:
  build:
    # Job-level rather than workflow-level (SonarCloud S8233/S8264). The build job only READS
    # the repository; the write scopes Pages deployment needs belong to the job that deploys.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs
      - name: Build Jekyll site
        run: cd docs && bundle exec jekyll build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    needs: build
    # Only this job publishes, so only this job carries the write scopes.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
